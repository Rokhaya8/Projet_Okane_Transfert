<div class="login-container">
  <div class="login-card">

    <div class="login-brand">
      <span class="brand-okane">Okane</span>
      <span class="brand-transfer">Transfer</span>
    </div>

    <p class="login-subtitle">Connectez-vous à votre espace de travail</p>

    <div class="form-group">
      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        name="email"
        [(ngModel)]="email"
        placeholder="exemple@okane.com"
        (keyup.enter)="onSubmit()"
      />
    </div>

    <div class="form-group">
      <label for="password">Mot de passe</label>
      <input
        type="password"
        id="password"
        name="password"
        [(ngModel)]="password"
        placeholder="••••••••"
        (keyup.enter)="onSubmit()"
      />
    </div>

    @if (errorMessage) {
      <div class="error-message">{{ errorMessage }}</div>
    }

    <button (click)="onSubmit()" [disabled]="loading">
      {{ loading ? 'Connexion...' : 'Se connecter' }}
    </button>

  </div>
</div>
