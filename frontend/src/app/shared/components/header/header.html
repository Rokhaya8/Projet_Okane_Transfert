<header class="top-header">
  <div class="header-left">
    <button type="button" class="mobile-menu-btn" (click)="toggleMobileMenu()"
            [attr.aria-label]="isMobileMenuOpen ? 'Fermer le menu' : 'Ouvrir le menu'">
      <span class="material-icons">{{ isMobileMenuOpen ? 'close' : 'menu' }}</span>
    </button>
    <div class="header-title">
      <h2>{{ pageTitle }}</h2>
    </div>
  </div>
  <div class="header-profile-zone">
    <button class="icon-btn">
      <span class="material-icons">notifications</span>
      <span class="notification-badge"></span>
    </button>
    <div class="user-info-block">
      <span class="user-name">{{ userName }}</span>
      <span class="user-email">{{ userEmail }}</span>
    </div>
    <div class="user-avatar">{{ getUserInitials() }}</div>
    <button class="icon-btn logout-btn" (click)="onLogout()">
      <span class="material-icons">logout</span>
    </button>
  </div>
</header>
